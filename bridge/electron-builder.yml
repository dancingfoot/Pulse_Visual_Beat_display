appId: "com.pulselink.bridge"
productName: "Pulse Link Bridge"
directories:
  output: "dist-appimage"
files:
  - "**/*"
  - "!dist-appimage/**/*"
linux:
  target:
    - target: "AppImage"
      arch:
        - "x64"
    - target: "deb"
      arch:
        - "x64"
  category: "Audio"
  synopsis: "Ableton Link to WebSockets Network Bridge"
  description: "Bridges local native Ableton Link UDP multicast sessions with Pulse Link web applications."
  desktop:
    StartupWMClass: "Pulse Link Bridge"
asar: false
npmRebuild: true
