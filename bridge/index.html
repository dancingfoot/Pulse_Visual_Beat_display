<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pulse Link — Ableton Link Bridge</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #0b0d11;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      padding: 16px;
      overflow-x: hidden;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-badge {
      background: #ff3b30;
      color: #fff;
      font-weight: 900;
      font-size: 11px;
      padding: 3px 6px;
      border-radius: 4px;
      letter-spacing: 1px;
    }
    .title {
      font-weight: 700;
      font-size: 15px;
      letter-spacing: -0.5px;
    }
    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-family: monospace;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #888;
    }
    .dot.connected {
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }
    .dot.disconnected {
      background: #ef4444;
      box-shadow: 0 0 8px #ef4444;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }
    .card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .card-title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.4);
      font-family: monospace;
    }
    .stat-val {
      font-size: 26px;
      font-weight: 800;
      font-family: monospace;
      color: #fff;
    }
    .stat-sub {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.5);
      font-family: monospace;
    }

    /* Phase Visualizer */
    .phase-bar-container {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 4px;
    }
    .phase-bar {
      height: 100%;
      width: 0%;
      background: #ff3b30;
      transition: width 0.04s linear;
    }

    /* Beat Dots */
    .beat-dots {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }
    .beat-dot {
      flex: 1;
      height: 6px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.1);
    }
    .beat-dot.active {
      background: #00bfff;
      box-shadow: 0 0 10px #00bfff;
    }
    .beat-dot.accent.active {
      background: #ff3b30;
      box-shadow: 0 0 10px #ff3b30;
    }

    /* Controls */
    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
    }
    label {
      font-size: 11px;
      font-family: monospace;
      color: rgba(255, 255, 255, 0.6);
    }
    .input-row {
      display: flex;
      gap: 8px;
    }
    input[type="text"] {
      flex: 1;
      background: #14171d;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 8px 10px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 12px;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: #ff3b30;
    }
    button {
      background: #ff3b30;
      border: none;
      color: #fff;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-family: monospace;
      transition: all 0.15s ease;
    }
    button:hover {
      background: #e02f25;
    }
    button.secondary {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
    }
    button.secondary:hover {
      background: rgba(255, 255, 255, 0.15);
    }
    button.active-toggle {
      background: #10b981;
    }

    .preset-buttons {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }
    .preset-btn {
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.7);
      cursor: pointer;
    }
    .preset-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
    }

    /* Logs */
    .log-container {
      background: #060709;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 8px 10px;
      font-family: monospace;
      font-size: 11px;
      height: 110px;
      overflow-y: auto;
      color: #94a3b8;
      line-height: 1.4;
    }
    .log-entry {
      margin-bottom: 3px;
      word-break: break-all;
    }
    .log-entry.success { color: #10b981; }
    .log-entry.error { color: #ef4444; }
    .log-entry.warn { color: #f59e0b; }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <span class="logo-badge">LINK</span>
      <span class="title">Pulse Link Bridge</span>
    </div>
    <div id="ws-status" class="status-badge">
      <span id="ws-dot" class="dot disconnected"></span>
      <span id="ws-text">Connecting...</span>
    </div>
  </div>

  <div class="grid">
    <!-- Ableton Link Card -->
    <div class="card">
      <span class="card-title">Ableton Link Network</span>
      <div class="stat-val" id="peer-count">0</div>
      <div class="stat-sub" id="link-status">Searching for DAWs on LAN</div>
      <div class="beat-dots" id="beat-dots">
        <div class="beat-dot"></div>
        <div class="beat-dot"></div>
        <div class="beat-dot"></div>
        <div class="beat-dot"></div>
      </div>
    </div>

    <!-- Tempo & Phase Card -->
    <div class="card">
      <span class="card-title">Synchronized Tempo</span>
      <div class="stat-val"><span id="bpm-val">120.0</span> <span style="font-size:14px; font-weight: normal; opacity:0.6;">BPM</span></div>
      <div class="stat-sub">Beat <span id="beat-val">1.0</span> / 4</div>
      <div class="phase-bar-container">
        <div id="phase-bar" class="phase-bar"></div>
      </div>
    </div>
  </div>

  <!-- WebSocket Server Connection -->
  <div class="field-group">
    <label>TARGET WEBSOCKET SERVER</label>
    <div class="input-row">
      <input type="text" id="ws-url" value="ws://localhost:3000/ws" />
      <button id="btn-reconnect">Connect</button>
    </div>
    <div class="preset-buttons">
      <button class="preset-btn" onclick="setPreset('ws://localhost:3000/ws')">Localhost (Port 3000)</button>
      <button class="preset-btn" onclick="setPreset('wss://ais-dev-j7uww6till4lzftkakp2mn-607134393697.europe-west2.run.app/ws')">Cloud Server (AIS)</button>
    </div>
  </div>

  <!-- Quick Action Toggles -->
  <div style="display:flex; gap:8px; margin-bottom:12px;">
    <button id="btn-link-toggle" class="secondary" style="flex:1;">Ableton Link: ON</button>
    <button id="btn-startstop-toggle" class="secondary" style="flex:1;">Start/Stop Sync: ON</button>
  </div>

  <!-- Realtime Activity Log -->
  <div class="field-group">
    <label>LIVE ACTIVITY LOG</label>
    <div class="log-container" id="log-box">
      <div class="log-entry">Initializing native Ableton Link UDP stack...</div>
    </div>
  </div>

  <script>
    const { ipcRenderer } = window.require ? window.require('electron') : { ipcRenderer: null };

    const peerCountEl = document.getElementById('peer-count');
    const linkStatusEl = document.getElementById('link-status');
    const bpmValEl = document.getElementById('bpm-val');
    const beatValEl = document.getElementById('beat-val');
    const phaseBarEl = document.getElementById('phase-bar');
    const wsDotEl = document.getElementById('ws-dot');
    const wsTextEl = document.getElementById('ws-text');
    const wsUrlInput = document.getElementById('ws-url');
    const btnReconnect = document.getElementById('btn-reconnect');
    const btnLinkToggle = document.getElementById('btn-link-toggle');
    const btnStartStopToggle = document.getElementById('btn-startstop-toggle');
    const logBox = document.getElementById('log-box');
    const beatDots = document.querySelectorAll('.beat-dot');

    function log(msg, type = '') {
      const entry = document.createElement('div');
      entry.className = 'log-entry ' + type;
      const time = new Date().toLocaleTimeString();
      entry.textContent = `[${time}] ${msg}`;
      logBox.appendChild(entry);
      logBox.scrollTop = logBox.scrollHeight;
    }

    function setPreset(url) {
      wsUrlInput.value = url;
      if (ipcRenderer) {
        ipcRenderer.send('change-server-url', url);
        log(`Target changed to ${url}`);
      }
    }

    btnReconnect.addEventListener('click', () => {
      const url = wsUrlInput.value.trim();
      if (ipcRenderer) {
        ipcRenderer.send('change-server-url', url);
        log(`Reconnecting to ${url}...`);
      }
    });

    let linkEnabled = true;
    btnLinkToggle.addEventListener('click', () => {
      linkEnabled = !linkEnabled;
      btnLinkToggle.textContent = `Ableton Link: ${linkEnabled ? 'ON' : 'OFF'}`;
      if (ipcRenderer) ipcRenderer.send('toggle-link', linkEnabled);
    });

    let startStopEnabled = true;
    btnStartStopToggle.addEventListener('click', () => {
      startStopEnabled = !startStopEnabled;
      btnStartStopToggle.textContent = `Start/Stop Sync: ${startStopEnabled ? 'ON' : 'OFF'}`;
      if (ipcRenderer) ipcRenderer.send('toggle-startstop', startStopEnabled);
    });

    if (ipcRenderer) {
      ipcRenderer.on('log', (event, msg, type) => {
        log(msg, type);
      });

      ipcRenderer.on('ws-status', (event, data) => {
        if (data.connected) {
          wsDotEl.className = 'dot connected';
          wsTextEl.textContent = 'Connected';
        } else {
          wsDotEl.className = 'dot disconnected';
          wsTextEl.textContent = 'Disconnected';
        }
      });

      ipcRenderer.on('link-metrics', (event, data) => {
        peerCountEl.textContent = data.peers;
        linkStatusEl.textContent = data.peers === 0 
          ? 'No local peers found' 
          : `${data.peers} peer(s) connected on LAN`;
        
        bpmValEl.textContent = Number(data.bpm).toFixed(1);
        
        const beatNum = (Math.floor(data.phase) % 4) + 1;
        beatValEl.textContent = `${beatNum} / 4`;

        // Update progress bar
        const progress = ((data.phase % 1) * 100).toFixed(0);
        phaseBarEl.style.width = `${progress}%`;

        // Update beat dots
        beatDots.forEach((dot, index) => {
          if (index === beatNum - 1) {
            dot.className = `beat-dot active ${index === 0 ? 'accent' : ''}`;
          } else {
            dot.className = 'beat-dot';
          }
        });
      });
    }
  </script>
</body>
</html>
